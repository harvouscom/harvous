<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Onboarding Thread</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #4a473d;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #5a574d;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f5f5f5;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>Test Onboarding Thread</h1>
    <p>Use the button below to directly create the onboarding thread for testing.</p>
    
    <button onclick="createOnboardingThread()">Create Onboarding Thread</button>
    
    <div id="result"></div>

    <script>
        async function createOnboardingThread() {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '<p>Creating onboarding thread...</p>';
            
            try {
                const response = await fetch('/api/test/create-onboarding-thread', {
                    method: 'POST',
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Success!</h3>
                        <p>${data.message}</p>
                        <p><strong>Thread ID:</strong> ${data.threadId}</p>
                        <p><strong>Notes Created:</strong> ${data.notesCreated}</p>
                        <p><strong>Next step:</strong> <a href="/">Go to dashboard</a> to see the onboarding thread.</p>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>${data.success === false ? 'ℹ️ Info' : '❌ Error'}</h3>
                        <p>${data.message || data.error || 'Unknown error'}</p>
                        ${data.threadId ? `<p><strong>Thread ID:</strong> ${data.threadId}</p>` : ''}
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h3>❌ Error</h3><p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>

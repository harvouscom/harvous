<!doctype html>
<!--
  Source for kws-banner-720x250.png, the banner Epic's Kids Web Services shows at the top of the
  parent verification email. KWS requires exactly 720 x 250 px, JPG or PNG.
  Re-render: node docs/brand/kws/render.mjs (see docs/KWS_BRANDING.md).

  The app icon (the accent gradient with the white mark) alone on the site paper (#f7f6f3, the
  sign-in page's --site-paper). No wordmark: the email already names Harvous.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 720px; height: 250px; overflow: hidden;
    display: grid; place-items: center;
    background: #f7f6f3;
  }
  img {
    display: block; width: 128px; height: 128px; border-radius: 29px;
    box-shadow: 0 1px 2px rgba(20, 18, 12, 0.08), 0 14px 32px -12px rgba(0, 80, 200, 0.35);
  }
</style>
</head>
<body>
  <img src="../../../public/images/icons/icon-512.png" alt="">
</body>
</html>

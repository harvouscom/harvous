name: Aggregate Monthly Analytics

on:
  schedule:
    # Run on the 1st of each month at 2 AM UTC (to aggregate previous month)
    - cron: '0 2 1 * *'
  workflow_dispatch: # Allow manual triggering from GitHub Actions UI

jobs:
  aggregate-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate Monthly Analytics
        env:
          SITE_URL: ${{ secrets.AUTO_ARCHIVE_SITE_URL || 'https://app.harvous.com' }}
          SECRET_TOKEN: ${{ secrets.AUTO_ARCHIVE_SECRET_TOKEN }}
        run: |
          echo "Aggregating analytics for previous month"
          if [ -z "$SECRET_TOKEN" ]; then
            echo "ERROR: AUTO_ARCHIVE_SECRET_TOKEN GitHub secret is required"
            exit 1
          fi

          call_api() {
            local url="$1"
            local label="$2"
            response=$(curl -s -w "\n%{http_code}" -X POST "$url" \
              -H "Authorization: Bearer $SECRET_TOKEN")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "[$label] $body"
            echo "[$label] HTTP status: $http_code"
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "[$label] failed with HTTP $http_code"
              exit 1
            fi
          }

          call_api "$SITE_URL/api/admin/aggregate-analytics?previous=true&skipReport=1" "aggregate"

          PREV_MONTH=$(date -u -d "1 month ago" +%Y-%m)
          call_api "$SITE_URL/api/admin/reports/generate?month=$PREV_MONTH" "report"

name: Sync release notes to marketing site

on:
  push:
    branches: [main]
    paths:
      - "Changelog/**"
      - "scripts/export-changelog-csv.js"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Checkout marketing site
        uses: actions/checkout@v4
        with:
          repository: harvouscom/harvous.com
          path: harvous.com
          token: ${{ secrets.HARVOUS_COM_SYNC_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Export missing changelog rows
        run: npm run changelog:export:backfill -- --csv harvous.com/data/webflow-changelog.csv

      - name: Commit and push marketing CSV
        working-directory: harvous.com
        run: |
          if git diff --quiet data/webflow-changelog.csv; then
            echo "No CSV changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/webflow-changelog.csv
          git commit -m "Sync release notes from app changelog."
          git push

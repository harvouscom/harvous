# Deploy the SPA + Worker to Cloudflare (Phase A — docs/CLOUDFLARE_MIGRATION.md).
#
# Cloudflare has no git integration, so this replaces what Netlify's build hook did.
# Netlify keeps building `main` in parallel during the cutover soak; it is the rollback
# path and is not touched here.
name: Deploy to Cloudflare

on:
  push:
    branches: [main, staging]
    # Mirrors scripts/netlify-skip-build.sh, which skips only when EVERY changed file is
    # doc-only. paths-ignore reproduces that exactly; a `paths` allowlist would instead
    # silently skip deploys for any path nobody remembered to list.
    paths-ignore:
      - 'docs/**'
      - 'Changelog/**'
      - 'help/**'
      - 'release-notes/**'
  workflow_dispatch:

# One deploy at a time per branch; a newer push supersedes an in-flight one.
concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # was NODE_VERSION in netlify.toml
          cache: npm

      # NPM_FLAGS from netlify.toml
      - run: npm ci --prefer-offline --no-audit

      # Rolls the PWA cache key so returning clients pick up the new build. Reads
      # GITHUB_SHA here — Netlify's COMMIT_REF/DEPLOY_ID do not exist on Actions, and
      # without a build id every deploy between two version bumps ships a byte-identical
      # sw.js. See the comment block in the script itself.
      - run: node scripts/inject-sw-cache-version.js

      - run: npm run build:spa
        env:
          # EXACTLY the 10 build-time vars Netlify's PRODUCTION context sets, verified
          # 2026-08-30 via `netlify env:list --context production`. Do not add to this list
          # on the theory that a var "looks needed": Phase A must produce a bundle
          # indistinguishable from today's, and a var Netlify leaves unset is a var this
          # build must leave unset too.
          #
          # VITE_SUPABASE_* were deliberately absent during the cutover, to keep the bundle
          # byte-identical to Netlify's. Added 2026-09-02, after the cutover, to TURN REALTIME
          # ON — it has never run in production because these two were the only missing piece.
          # Everything else was already in place: the RLS policies and
          # harvous_realtime_topic_allowed() exist in the production database, and Fly has
          # SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY, so the server could always broadcast —
          # there were simply no subscribers. The anon key is public by design; it ships in
          # the browser bundle and RLS on realtime.messages is what actually enforces access.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Still ABSENT on purpose, though the code reads them:
          #   VITE_API_BASE_URL — unset, so the SPA calls its own origin. Correct, since the
          #     Worker proxies /api/* to Fly.
          #   VITE_PUBLIC_POSTHOG_KEY — the code reads it, production never sets it;
          #     PUBLIC_POSTHOG_KEY is the one that is actually used.
          #   VITE_POLAR_CHURCH_PRODUCT_* — referenced in one file, unset in production.
          #
          # Live Clerk on main, dev Clerk on staging (new.harvous.com), matching
          # netlify.toml's [context.staging]. The key is inlined at build time, which is why
          # staging is a separate build rather than a redeploy of the same artifact.
          # WARNING: VITE_CLERK_PUBLISHABLE_KEY in the repo's .env is a pk_test_ DEV key.
          # The _LIVE secret must come from the Clerk dashboard, not from .env — copying it
          # across is what failed all three Fly cutovers.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ github.ref_name == 'main' && secrets.VITE_CLERK_PUBLISHABLE_KEY_LIVE || secrets.VITE_CLERK_PUBLISHABLE_KEY_DEV }}
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ github.ref_name == 'main' && secrets.VITE_CLERK_PUBLISHABLE_KEY_LIVE || secrets.VITE_CLERK_PUBLISHABLE_KEY_DEV }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          VITE_CLERK_SHARED_SPACES_PLAN_ID: ${{ secrets.VITE_CLERK_SHARED_SPACES_PLAN_ID }}
          # Public plan identifiers, not secrets (netlify.toml carried them in
          # SECRETS_SCAN_OMIT_KEYS for exactly this reason). Omitting these is what made
          # billing return zero plans during the Fly migration.
          VITE_POLAR_PLUS_PRODUCT_MONTHLY: ${{ secrets.VITE_POLAR_PLUS_PRODUCT_MONTHLY }}
          VITE_POLAR_PLUS_PRODUCT_ANNUAL: ${{ secrets.VITE_POLAR_PLUS_PRODUCT_ANNUAL }}
          VITE_POLAR_CONNECTOR_PRODUCT_MONTHLY: ${{ secrets.VITE_POLAR_CONNECTOR_PRODUCT_MONTHLY }}
          VITE_POLAR_CONNECTOR_PRODUCT_ANNUAL: ${{ secrets.VITE_POLAR_CONNECTOR_PRODUCT_ANNUAL }}

      # Cloudflare-only routing/header config. Deliberately NOT in public/ — Vite copies
      # public/ verbatim, so a file there would also ship to Netlify and layer a second
      # header source onto the live rollback target mid-soak.
      - name: Stage Cloudflare _headers / _redirects / .assetsignore
        # .assetsignore is not optional: Workers assets reject any single file over 5 MiB,
        # and dist-spa/assets/index-*.js.map is ~10 MB. Without it the deploy fails outright
        # with "Invalid manifest: file size ... exceeds 5242880 limit [code: 10304]".
        run: cp cloudflare/_headers cloudflare/_redirects cloudflare/.assetsignore dist-spa/

      # Staging authenticates against a Clerk DEVELOPMENT instance, which serves clerk.js
      # from <slug>.clerk.accounts.dev. Production's CSP allows *.clerk.com and
      # clerk.harvous.com only, so the dev script is blocked and the app never boots.
      #
      # That gap is latent on Netlify rather than absent: netlify.toml documents
      # [context.staging] as "dev Clerk", but new.harvous.com actually ships pk_live_ today,
      # so the dev path has never been exercised there. Verified 2026-09-01.
      #
      # Applied to STAGING ONLY, and derived from the production file rather than duplicated,
      # so production's CSP stays byte-identical to netlify.toml and the two cannot drift.
      - name: Widen CSP for the dev Clerk instance (staging only)
        if: github.ref_name != 'main'
        run: |
          node -e '
            const fs = require("fs");
            const f = "dist-spa/_headers";
            let h = fs.readFileSync(f, "utf8");
            const before = h;
            for (const d of ["script-src", "frame-src"]) {
              h = h.replace(new RegExp("(" + d + " [^;]*)", "g"),
                            "$1 https://*.clerk.accounts.dev");
            }
            if (h === before) { console.error("CSP not modified — directive names changed?"); process.exit(1); }
            fs.writeFileSync(f, h);
            console.log("staging CSP: added *.clerk.accounts.dev to script-src and frame-src");
          '

      # A staging install must not be able to pass for the production app on a home screen.
      # public/manifest.json is one shared file: same name, same icon, start_url "/", so the
      # two installs are indistinguishable once added — and staging's carries `url_handlers`
      # for app.harvous.com plus handle_links "preferred", i.e. it ASKS to capture production
      # links. Production's .well-known/web-app-origin-association should refuse that, but the
      # request should not be made at all from a build signed with the dev Clerk key.
      - name: Name the staging PWA distinctly (staging only)
        if: github.ref_name != 'main'
        run: |
          node -e '
            const fs = require("fs");
            const f = "dist-spa/manifest.json";
            const m = JSON.parse(fs.readFileSync(f, "utf8"));
            m.name = "Harvous (Staging)";
            m.short_name = "Harvous Staging";
            m.description = "Harvous staging — development Clerk instance";
            delete m.url_handlers;
            delete m.handle_links;
            fs.writeFileSync(f, JSON.stringify(m, null, 2) + "\n");
            console.log("staging manifest:", m.name, "| url_handlers removed");
          '

      # Guards the one regression this migration is most likely to ship. See the ordering
      # note in cloudflare/_headers.
      - name: Assert the two deploy-breaking invariants
        run: |
          # The cache tier that costs ~703.7 KB per visit if it regresses.
          grep -q 'max-age=31536000, immutable' dist-spa/_headers
          # No asset may exceed the 5 MiB Workers limit once .assetsignore is applied.
          if find dist-spa -type f -size +5242880c ! -name '*.map' | grep -q .; then
            echo "Asset over the 5 MiB Workers limit:" >&2
            find dist-spa -type f -size +5242880c ! -name '*.map' -exec ls -lh {} \; >&2
            exit 1
          fi

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ONLY main reaches the production Worker; everything else — the staging branch and
          # any manual workflow_dispatch — goes to harvous-app-staging.
          #
          # The condition is NEGATED on purpose. GitHub's `A && B || C` is not a ternary: it
          # is boolean short-circuiting, so when B is an EMPTY STRING it is falsy and the
          # expression falls through to C. Writing this the intuitive way round —
          # `ref_name == 'main' && '' || '--env staging'` — therefore sends *main* to staging,
          # which is exactly what happened on the first CI run (2026-09-01: `deploy --env
          # staging` executed on main, putting a live-Clerk build on the staging Worker).
          # Keep the non-empty value in the TRUE position.
          command: deploy ${{ github.ref_name != 'main' && '--env staging' || '' }}

      # Assert what the WORLD sees, not what the deploy claims. Nothing before this point
      # can catch a wrong-Clerk-key build reaching a real host: the key is inlined at build
      # time, so a mis-scoped secret or a hand-run `wrangler deploy` from a worktree with a
      # dev .env produces a bundle that deploys, boots, and signs users into the development
      # Clerk instance. One did reach an installed PWA after the cutover, and the service
      # worker then pinned it there — `/assets/*` is cache-first with no revalidation, so the
      # only cure was deleting the home-screen install. spa/src/main.tsx now self-heals that
      # on the client; this is the half that stops it being shipped in the first place.
      - name: Verify the live host serves this build, with the right Clerk instance
        env:
          HOST: ${{ github.ref_name == 'main' && 'app.harvous.com' || 'new.harvous.com' }}
          EXPECT: ${{ github.ref_name == 'main' && 'pk_live_' || 'pk_test_' }}
          FORBID: ${{ github.ref_name == 'main' && 'pk_test_' || 'pk_live_' }}
        run: |
          set -uo pipefail

          EXPECTED_BUNDLE=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist-spa/index.html | head -1)
          if [ -z "$EXPECTED_BUNDLE" ]; then
            echo "::error::no assets/index-*.js reference in dist-spa/index.html"; exit 1
          fi
          SHA8=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)

          # Pin the IP from a public resolver. A runner holds no stale cache, but the lesson
          # from the cutover (docs/CLOUDFLARE_MIGRATION.md) is to verify against what public
          # DNS answers, never against whatever the local box happens to have. If dig is
          # unavailable the checks still run, just unpinned.
          CURL=(curl -fsS --max-time 30 -H 'Cache-Control: no-cache')
          IP=$(dig +short "$HOST" @1.1.1.1 2>/dev/null | grep -E '^[0-9.]+$' | head -1)
          if [ -n "$IP" ]; then
            CURL+=(--resolve "$HOST:443:$IP")
            echo "pinned $HOST to $IP"
          else
            echo "dig returned nothing for $HOST — falling back to the runner's resolver"
          fi

          # The edge can answer `/` from cache for a moment after a deploy, so retry rather
          # than fail on a race. `/` is no-cache/must-revalidate, so this settles quickly.
          # Every fetch lands in a file before it is read. A `curl … | grep -q` pipeline
          # looks equivalent and is not: grep exits at the first match, curl takes SIGPIPE,
          # and pipefail then reports a passing check as a failure — intermittently, since
          # it depends on whether curl finished writing first.
          SERVED=""
          for attempt in 1 2 3 4 5 6; do
            "${CURL[@]}" "https://$HOST/" -o served.html || true
            SERVED=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' served.html | head -1)
            [ "$SERVED" = "$EXPECTED_BUNDLE" ] && break
            echo "attempt $attempt: serving '${SERVED:-nothing}', want '$EXPECTED_BUNDLE'"
            sleep 10
          done
          if [ "$SERVED" != "$EXPECTED_BUNDLE" ]; then
            echo "::error::$HOST never served $EXPECTED_BUNDLE from this deploy"; exit 1
          fi

          "${CURL[@]}" "https://$HOST/$SERVED" -o bundle.js || { echo "::error::could not fetch $SERVED"; exit 1; }

          # A trailing run of key characters is what separates a real key from the badge's own
          # `startsWith("pk_test_")` literal, which is present in EVERY build by design.
          # Forbidden first: a bundle carrying the other instance's key is the failure this
          # step exists for, and it deserves the actionable message rather than the generic
          # "no key found" one it would otherwise trip on.
          if grep -qE "${FORBID}[A-Za-z0-9]{20,}" bundle.js; then
            echo "::error::$HOST is serving a ${FORBID} Clerk key — WRONG INSTANCE, roll back"; exit 1
          fi
          if ! grep -qE "${EXPECT}[A-Za-z0-9]{20,}" bundle.js; then
            echo "::error::$HOST is serving a bundle with no ${EXPECT} Clerk key"; exit 1
          fi
          rm -f bundle.js

          # A byte-identical sw.js means the browser never re-runs install/activate, so the
          # previous deploy's cache is never dropped. The build id is what prevents that.
          "${CURL[@]}" "https://$HOST/sw.js" -o sw.js || { echo "::error::could not fetch /sw.js"; exit 1; }
          if ! grep -q "CACHE_NAME = 'harvous-cache-.*-${SHA8}'" sw.js; then
            echo "::error::$HOST /sw.js does not carry this build's id (${SHA8}) — stale caches will persist"; exit 1
          fi

          rm -f served.html sw.js
          echo "$HOST serves $SERVED with a ${EXPECT} key, sw.js pinned to ${SHA8}"

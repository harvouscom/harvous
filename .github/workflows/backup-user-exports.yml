name: Backup User Exports

on:
  schedule:
    # Daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup-exports:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backup exports
        env:
          # Calls Fly directly rather than app.harvous.com. Exporting every user
          # takes longer than the Cloudflare Worker's proxy will wait
          # (API_UPSTREAM_TIMEOUT_MS, 20s, in cloudflare/worker.ts), so going
          # through it returns 504 while the job runs on happily to completion —
          # a failed workflow for a backup that actually worked. Netlify had the
          # same problem at ~28s. Fly imposes no such ceiling. Only long-running admin jobs need this; ordinary API
          # traffic should keep using app.harvous.com.
          SITE_URL: ${{ secrets.BACKUP_SITE_URL || 'https://harvous.fly.dev' }}
          BACKUP_CRON_SECRET: ${{ secrets.BACKUP_CRON_SECRET }}
        run: |
          if [ -z "$BACKUP_CRON_SECRET" ]; then
            echo "BACKUP_CRON_SECRET not set; skipping backup."
            exit 1
          fi
          response=$(curl -s -w "\n%{http_code}" -X POST "$SITE_URL/api/admin/backup-exports" \
            -H "Authorization: Bearer $BACKUP_CRON_SECRET")
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "Backup returned HTTP $code"
            exit 1
          fi

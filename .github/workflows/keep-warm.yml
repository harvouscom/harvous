name: Keep Functions Warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Only one run at a time; a new run cancels any in-progress run (avoids pile-up and ambiguous cancellations)
concurrency:
  group: keep-functions-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -s -o /dev/null -w "%{http_code}" https://app.harvous.com/api/health || true
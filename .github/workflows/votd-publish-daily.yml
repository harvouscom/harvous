name: Publish Verse of the Day

on:
  schedule:
    # Two runs a day, and each one publishes BOTH today and tomorrow (UTC), both idempotent.
    #
    # It used to decide which day to publish from the clock (`HOUR=9 && MIN<15` → tomorrow). GitHub
    # starts scheduled jobs hours late — Nov 2026 the 09:00 run was landing at 16:40-19:20 UTC and
    # the 00:05 run at 06:00-07:00 UTC — so the early run never saw hour 9, republished today as a
    # no-op, and tomorrow's verse only landed with the late catch-up: after midnight for readers in
    # the Americas, who got yesterday's passage until it did. Publishing both days every run makes
    # the start time irrelevant.
    - cron: '0 9 * * *'
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  votd-publish:
    runs-on: ubuntu-latest
    # If VOTD_CRON_SECRET lives under Settings → Environments → <name> (not Repository secrets),
    # uncomment the next line and use that environment name (otherwise the secret is empty in CI):
    # environment: production
    steps:
      - name: Publish daily VOTD
        env:
          # Calls Fly directly, like backup-user-exports. Since the Cloudflare cutover (Oct 27 2026)
          # app.harvous.com answers GitHub's runners with a 403 "Just a moment..." bot challenge,
          # so nothing published and every reader stayed on the last verse.
          SITE_URL: ${{ secrets.VOTD_PUBLISH_SITE_URL || 'https://harvous.fly.dev' }}
          SECRET_TOKEN: ${{ secrets.VOTD_CRON_SECRET }}
        run: |
          set -euo pipefail
          # Normalize line endings / stray newlines from secret managers
          SECRET_TOKEN="$(printf '%s' "${SECRET_TOKEN:-}" | tr -d '\r\n')"
          if [ -z "$SECRET_TOKEN" ]; then
            echo "::error::GitHub secret VOTD_CRON_SECRET is empty. Add it under Settings → Secrets and variables → Actions (same value as the Fly secret VOTD_CRON_SECRET)."
            exit 1
          fi

          publish() {
            local suffix="$1"
            echo "Calling VOTD publish: ${SITE_URL}/api/admin/votd/publish-daily${suffix}"
            response_file="$(mktemp)"
            code="$(
              curl -sS -o "$response_file" -w '%{http_code}' -X POST "${SITE_URL}/api/admin/votd/publish-daily${suffix}" \
                -H "Authorization: Bearer ${SECRET_TOKEN}"
            )"
            body="$(cat "$response_file")"
            rm -f "$response_file"
            echo "$body"
            echo "$code"

            if [ "$code" != "200" ]; then
              echo "::error::VOTD publish failed with HTTP $code (expected 200). Body above. An HTML \"Just a moment\" body is a Cloudflare bot challenge, not the app. A JSON 401 means the Fly secret VOTD_CRON_SECRET does not match the GitHub secret of the same name."
              exit 1
            fi
          }

          # Today first (also backfills yesterday server-side), then tomorrow.
          publish ''
          publish '?target=next'

name: Publish Verse of the Day

on:
  schedule:
    # 23:55 UTC: insert tomorrow's FeaturedItems row before UTC midnight so when yesterday's
    # VOTD hits endsAt (next midnight), today's row is already present (no gap until 11:00 publish).
    - cron: '55 23 * * *'
    # 00:05 UTC: idempotent catch-up if the early run failed (publishes "today" if missing).
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  votd-publish:
    runs-on: ubuntu-latest
    # If VOTD_CRON_SECRET lives under Settings → Environments → <name> (not Repository secrets),
    # uncomment the next line and use that environment name (otherwise the secret is empty in CI):
    # environment: production
    steps:
      - name: Publish daily VOTD
        env:
          SITE_URL: ${{ secrets.VOTD_PUBLISH_SITE_URL || 'https://app.harvous.com' }}
          SECRET_TOKEN: ${{ secrets.VOTD_CRON_SECRET }}
        run: |
          set -euo pipefail
          # Normalize line endings / stray newlines from secret managers
          SECRET_TOKEN="$(printf '%s' "${SECRET_TOKEN:-}" | tr -d '\r\n')"

          HOUR="$(date -u +%H)"
          MIN="$(date -u +%M)"
          MIN=$((10#$MIN))
          if [ "$HOUR" = "23" ] && [ "$MIN" -ge 50 ]; then
            SUFFIX='?target=next'
            echo "VOTD: early publish for next UTC calendar day (target=next)"
          else
            SUFFIX=''
            echo "VOTD: publish for current UTC calendar day (catch-up or manual)"
          fi

          echo "Calling VOTD publish: ${SITE_URL}/api/admin/votd/publish-daily${SUFFIX}"
          if [ -z "$SECRET_TOKEN" ]; then
            echo "::error::GitHub secret VOTD_CRON_SECRET is empty. Add it under Settings → Secrets and variables → Actions (same value as Netlify VOTD_CRON_SECRET)."
            exit 1
          fi
          echo "Bearer auth: enabled (secret length ${#SECRET_TOKEN} chars)"

          response_file="$(mktemp)"
          code="$(
            curl -sS -o "$response_file" -w '%{http_code}' -X POST "${SITE_URL}/api/admin/votd/publish-daily${SUFFIX}" \
              -H "Authorization: Bearer ${SECRET_TOKEN}"
          )"
          body="$(cat "$response_file")"
          rm -f "$response_file"
          echo "$body"
          echo "$code"

          if [ "$code" != "200" ]; then
            echo "::error::VOTD publish failed with HTTP $code (expected 200). Body above. On Netlify: set VOTD_CRON_SECRET for Production, redeploy functions, and match GitHub VOTD_CRON_SECRET exactly."
            exit 1
          fi

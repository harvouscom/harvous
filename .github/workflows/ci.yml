name: CI

# Until this existed, nothing ran the test suite or the typechecker automatically:
# every other workflow here is a content/cron job, and the only installed git hook is
# post-commit. `npm run precommit` was a convention nothing invoked. That is how a test
# importing a symbol which has never existed sat red in the suite, and how ~291 type
# errors accumulated unseen.
#
# Playwright is deliberately not here — the shared-spaces specs need the safe-E2E env and
# a disposable database, and must never run against production.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # server/routes/founder-letter.inline.generated.ts is gitignored and produced by
      # this script, which normally runs as part of dev:api / build:api. A fresh checkout
      # doesn't have it, so `tsc` reports a phantom "cannot find module" for its importer.
      # Any freshly cloned working copy hits the same thing before its first build.
      - name: Generate build-time sources
        run: node scripts/generate-founder-letter.js

      - name: Tests
        run: npm run test:run

      # Per-file ratchet rather than a clean `tsc --noEmit`: the repo still carries a
      # known backlog, recorded in scripts/typecheck-baseline.json. This fails when any
      # file's error count goes *up*, so the backlog can only shrink.
      # See docs/future/TYPECHECK_DEBT.md.
      - name: Typecheck ratchet
        run: npm run typecheck:ratchet

  # Separate job because it needs a real build, and dist-spa/ is gitignored. Every step in
  # `npm run precommit` is fast and build-free, so this belongs here rather than there.
  #
  # Guards the SPA's initial payload — the entry script, its modulepreload siblings and the
  # stylesheet, which every route waits for including sign-in. It went from 1.6 MB to 2.53 MB
  # while documented-but-ungated in docs/route-based-code-splitting.md, and grew 94 KB gzipped
  # in the single week before this job existed. See scripts/check-perf-budget.mjs.
  bundle-budget:
    name: Bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build:spa

      - name: Bundle budget ratchet
        run: npm run perf:check

name: Auto-Archive and Auto-Delete Inbox Items

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering from GitHub Actions UI

# Calls Fly directly: Cloudflare answers GitHub's runners at app.harvous.com with a
# 403 "Just a moment..." challenge, so the request never reaches the API. A literal
# rather than a secret override, because the old override pointed back at Cloudflare.
env:
  SITE_URL: https://harvous.fly.dev

jobs:
  inbox-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call Auto-Archive API
        env:
          SECRET_TOKEN: ${{ secrets.AUTO_ARCHIVE_SECRET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SECRET_TOKEN" ]; then
            echo "::error::GitHub secret AUTO_ARCHIVE_SECRET_TOKEN is empty."
            exit 1
          fi
          echo "Calling auto-archive endpoint: $SITE_URL/api/inbox/auto-archive"
          response_file="$(mktemp)"
          code="$(curl -sS --max-time 300 -o "$response_file" -w '%{http_code}' -X POST "$SITE_URL/api/inbox/auto-archive" \
            -H "Authorization: Bearer $SECRET_TOKEN" || true)"
          cat "$response_file"
          echo
          echo "HTTP $code"
          case "$code" in
            2??) ;;
            *)
              echo "::error::Auto-archive failed with HTTP $code. The response body is logged above."
              exit 1
              ;;
          esac

      # Runs even if archiving failed: deleting acts only on items archived earlier.
      - name: Call Auto-Delete API
        if: ${{ !cancelled() }}
        env:
          SECRET_TOKEN: ${{ secrets.AUTO_ARCHIVE_SECRET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SECRET_TOKEN" ]; then
            echo "::error::GitHub secret AUTO_ARCHIVE_SECRET_TOKEN is empty."
            exit 1
          fi
          echo "Calling auto-delete endpoint: $SITE_URL/api/inbox/auto-delete"
          response_file="$(mktemp)"
          code="$(curl -sS --max-time 300 -o "$response_file" -w '%{http_code}' -X POST "$SITE_URL/api/inbox/auto-delete" \
            -H "Authorization: Bearer $SECRET_TOKEN" || true)"
          cat "$response_file"
          echo
          echo "HTTP $code"
          case "$code" in
            2??) ;;
            *)
              echo "::error::Auto-delete failed with HTTP $code. The response body is logged above."
              exit 1
              ;;
          esac

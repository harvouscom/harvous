[build]
  command = "npm ci && npm run build"
  publish = "dist"
  ignore = "git diff --name-only \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" | grep -qv '^docs/' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "20.18.0"
  NPM_FLAGS = "--prefer-offline --no-audit"

# Redirect all non-API routes to index.html for SPA
# API routes are handled by Astro serverless functions and should not be redirected
# force = false means only redirect if the resource doesn't exist
# Since API routes exist as serverless functions, they won't be redirected
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.com https://*.posthog.com https://*.us.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.clerk.com https://*.clerk.accounts.dev https://*.posthog.com https://*.us.posthog.com https://api.bible.org; frame-src 'self' https://*.clerk.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # XSS Protection (legacy, but still useful)
    X-XSS-Protection = "1; mode=block"
    # Strict Transport Security (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Note: For scheduled functions, configure in Netlify dashboard:
# Site Settings > Functions > Scheduled Functions
# Or use an external cron service to call /api/inbox/auto-archive daily

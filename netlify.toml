[build]
  # 1. inject SW cache version (was handled by npm prebuild lifecycle, now explicit)
  # 2. build:api — bundles Hono server as Netlify Function (netlify/functions/api.cjs)
  # 3. build:spa — compiles the SPA into dist-spa/
  command = "npm ci && node scripts/inject-sw-cache-version.js && npm run build:api && npm run build:spa"
  publish = "dist-spa"
  # Skip build when only doc paths change (exit 0 = skip). See scripts/netlify-skip-build.sh.
  ignore = "bash scripts/netlify-skip-build.sh"

[functions]
  directory = "netlify/functions"
  node_bundler = "none"

[functions."purge-shared-spaces"]
  schedule = "@daily"

[functions."audienceful-activity-sync"]
  schedule = "@daily"

# Chromium screenshot OG images — prebuilt og-image.cjs (see build:api).
# Include @sparticuz/chromium AND its runtime deps (node_bundler=none does not
# hoist package.json dependencies into the function zip).
[functions.og-image]
  node_bundler = "none"
  external_node_modules = ["@sparticuz/chromium"]
  included_files = [
    "node_modules/@sparticuz/chromium/**",
    "node_modules/follow-redirects/**",
    "node_modules/tar-fs/**",
    "node_modules/tar-stream/**",
    "node_modules/pump/**",
    "node_modules/end-of-stream/**",
    "node_modules/once/**",
    "node_modules/wrappy/**",
    "node_modules/b4a/**",
    "node_modules/bare-fs/**",
    "node_modules/bare-os/**",
    "node_modules/bare-path/**",
    "node_modules/bare-url/**",
    "node_modules/bare-events/**",
    "node_modules/bare-stream/**",
    "node_modules/fast-fifo/**",
    "node_modules/streamx/**",
    "node_modules/events-universal/**",
    "node_modules/text-decoder/**",
    "node_modules/teex/**"
  ]
  timeout = 26
  memory = 3008

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--prefer-offline --no-audit"
  # Product ids are inlined into the SPA bundle by Vite; they're public plan identifiers, not secrets
  SECRETS_SCAN_OMIT_KEYS = "VITE_CLERK_UNLIMITED_PLAN_ID,CLERK_UNLIMITED_PLAN_ID,VITE_POLAR_PLUS_PRODUCT_MONTHLY,VITE_POLAR_PLUS_PRODUCT_ANNUAL,VITE_POLAR_PLUS_FOUNDING_DISCOUNT_ID,VITE_POLAR_CONNECTOR_PRODUCT_MONTHLY,VITE_POLAR_CONNECTOR_PRODUCT_ANNUAL,VITE_POLAR_CHURCH_PRODUCT_MONTHLY,VITE_POLAR_CHURCH_PRODUCT_ANNUAL,POLAR_PLUS_PRODUCT_MONTHLY,POLAR_PLUS_PRODUCT_ANNUAL,POLAR_PLUS_FOUNDING_DISCOUNT_ID,POLAR_CONNECTOR_PRODUCT_MONTHLY,POLAR_CONNECTOR_PRODUCT_ANNUAL,POLAR_CHURCH_PRODUCT_MONTHLY,POLAR_CHURCH_PRODUCT_ANNUAL"

# Prototype hosts: strip /prototype prefix from legacy bookmarks.
[[redirects]]
  from = "https://new.harvous.com/prototype/*"
  to = "https://new.harvous.com/:splat"
  status = 302
  force = true

# Strip /prototype prefix from legacy bookmarks on the dedicated host.
[[redirects]]
  from = "https://app.harvous.com/prototype/*"
  to = "https://app.harvous.com/:splat"
  status = 302
  force = true

# Redirect old URL format (/thread_ID) to new format (/thread/ID)
[[redirects]]
  from = "/thread_*"
  to = "/thread/:splat"
  status = 301

[[redirects]]
  from = "/note_*"
  to = "/note/:splat"
  status = 301

[[redirects]]
  from = "/space_*"
  to = "/space/:splat"
  status = 301

# PWA URL handling: serve web-app-origin-association at standard path
# (Astro endpoint lives at /well-known/...; Chrome fetches /.well-known/...)
[[redirects]]
  from = "/.well-known/web-app-origin-association"
  to = "/well-known/web-app-origin-association"
  status = 200
  force = true

# API routing (/api/* → Hono function) and SPA fallback handled by public/_redirects

# Dedicated Chromium screenshot function for OG images (before api.cjs catch-all)
[[redirects]]
  from = "/api/og/image/*"
  to = "/.netlify/functions/og-image/:splat"
  status = 200
  force = true

# Crawlers on share URLs → server OG meta HTML (humans keep SPA).
# Declared in-source only (netlify/edge-functions/shared-og.ts) so the
# declaration can carry pattern + user-agent matchers that keep non-crawler
# traffic from counting as billed invocations. Do not re-declare here.

# API routes must never be cached at the edge
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# OG meta + images are public and cacheable (after /api/* so this wins for /api/og/*)
[[headers]]
  for = "/api/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

# Security Headers + prevent stale index.html after deploy (reduces chunk 404s)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.com https://clerk.harvous.com https://*.js.stripe.com https://js.stripe.com https://*.posthog.com https://*.us.posthog.com https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.clerk.com https://clerk.harvous.com https://*.clerk.accounts.dev https://api.stripe.com https://*.posthog.com https://*.us.posthog.com https://api.bible.org; frame-src 'self' https://*.clerk.com https://clerk.harvous.com https://challenges.cloudflare.com https://*.js.stripe.com https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # XSS Protection (legacy, but still useful)
    X-XSS-Protection = "1; mode=block"
    # Strict Transport Security (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ─── Long-lived caching — declared AFTER the catch-all above, deliberately ────
#
# The order is load-bearing and used to be wrong. Netlify applies every matching
# `[[headers]]` rule and lets a later one override an earlier one for the same key, so
# the `/*` block's `no-cache, must-revalidate` was quietly beating the `immutable` that
# sat above it. Confirmed against production before changing anything: the deployed
# 2.7MB `/assets/index-*.js` answered `cache-control: no-cache,must-revalidate`, so every
# visit revalidated the whole bundle and every cold cache paid for it in full.
#
# The catch-all's `no-cache` exists to stop a stale index.html serving dead chunk hashes
# after a deploy. That reasoning is about HTML and should never have reached anything
# content-addressed. Moving these below it is the whole fix — do not "tidy" them back up.

# Hashed filenames: a change is a new name, so these can be kept forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts are NOT content-hashed, so not `immutable` — a year would be unrecallable if a
# face were ever replaced. Thirty days still turns the 1.4MB variable font from a
# revalidation on every page load into one fetch a month.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Wallpapers, space covers, auth heroes — 13MB of them. Stable names, same reasoning as
# fonts: a long but finite window rather than `immutable`.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Branch deploy: staging → new.harvous.com (dev Clerk, production DB).
# Assign new.harvous.com as branch domain in Netlify dashboard.
# Status page: add status.harvous.com as domain alias — see docs/STATUS_PAGE_SETUP.md
[context.staging]
  command = "npm ci && node scripts/inject-sw-cache-version.js && npm run build:api && npm run build:spa"

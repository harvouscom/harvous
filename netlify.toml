[build]
  # 1. inject SW cache version (was handled by npm prebuild lifecycle, now explicit)
  # 2. build:api — bundles Hono server as Netlify Function (netlify/functions/api.cjs)
  # 3. build:spa — compiles the SPA into dist-spa/
  command = "npm ci && node scripts/inject-sw-cache-version.js && npm run build:api && npm run build:spa"
  publish = "dist-spa"
  # Skip build when only doc paths change (exit 0 = skip). See scripts/netlify-skip-build.sh.
  ignore = "bash scripts/netlify-skip-build.sh"

[functions]
  directory = "netlify/functions"
  node_bundler = "none"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--prefer-offline --no-audit"
  # Plan ID is inlined into SPA bundle by Vite; it's a public plan identifier, not a secret
  SECRETS_SCAN_OMIT_KEYS = "VITE_CLERK_UNLIMITED_PLAN_ID,CLERK_UNLIMITED_PLAN_ID"

# new.harvous.com serves the 2.0 shell at / (SPA host routing). Classic app stays on app.harvous.com.
# Optional: strip legacy /prototype bookmarks on the new host only.
[[redirects]]
  from = "https://new.harvous.com/prototype/*"
  to = "https://new.harvous.com/:splat"
  status = 302
  force = true

# Redirect old URL format (/thread_ID) to new format (/thread/ID)
[[redirects]]
  from = "/thread_*"
  to = "/thread/:splat"
  status = 301

[[redirects]]
  from = "/note_*"
  to = "/note/:splat"
  status = 301

[[redirects]]
  from = "/space_*"
  to = "/space/:splat"
  status = 301

# PWA URL handling: serve web-app-origin-association at standard path
# (Astro endpoint lives at /well-known/...; Chrome fetches /.well-known/...)
[[redirects]]
  from = "/.well-known/web-app-origin-association"
  to = "/well-known/web-app-origin-association"
  status = 200
  force = true

# API routing (/api/* → Hono function) and SPA fallback handled by public/_redirects

# API routes must never be cached at the edge
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# SPA assets (hashed filenames) — long cache so CDN/browser don't revalidate
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security Headers + prevent stale index.html after deploy (reduces chunk 404s)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.com https://clerk.harvous.com https://*.js.stripe.com https://js.stripe.com https://*.posthog.com https://*.us.posthog.com https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.clerk.com https://clerk.harvous.com https://*.clerk.accounts.dev https://api.stripe.com https://*.posthog.com https://*.us.posthog.com https://api.bible.org; frame-src 'self' https://*.clerk.com https://clerk.harvous.com https://challenges.cloudflare.com https://*.js.stripe.com https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # XSS Protection (legacy, but still useful)
    X-XSS-Protection = "1; mode=block"
    # Strict Transport Security (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Note: For scheduled functions, configure in Netlify dashboard:
# Site Settings > Functions > Scheduled Functions
# Or use an external cron service to call /api/inbox/auto-archive daily

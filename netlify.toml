[build]
  # 1. astro build — compiles API routes + SSR function into dist/ and .netlify/
  # 2. vite build — compiles the SPA into dist-spa/
  # 3. cp — copy SPA assets into dist/ so Netlify serves them alongside Astro's SSR
  command = "npm ci && npm run build && node_modules/.bin/vite build && cp -r dist-spa/. dist/"
  publish = "dist"
  # Skip build when only doc paths change (exit 0 = skip). See scripts/netlify-skip-build.sh.
  ignore = "bash scripts/netlify-skip-build.sh"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--prefer-offline --no-audit"

# Redirect old URL format (/thread_ID) to new format (/thread/ID)
[[redirects]]
  from = "/thread_*"
  to = "/thread/:splat"
  status = 301

[[redirects]]
  from = "/note_*"
  to = "/note/:splat"
  status = 301

[[redirects]]
  from = "/space_*"
  to = "/space/:splat"
  status = 301

# PWA URL handling: serve web-app-origin-association at standard path
# (Astro endpoint lives at /well-known/...; Chrome fetches /.well-known/...)
[[redirects]]
  from = "/.well-known/web-app-origin-association"
  to = "/well-known/web-app-origin-association"
  status = 200
  force = true

# API routes are handled by the Astro SSR Netlify function — do not redirect them.
# The /.netlify/functions/ssr function matches /api/* automatically via the
# @astrojs/netlify adapter's function routing; this explicit rule ensures no
# catch-all below accidentally intercepts API requests in edge cases.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/ssr"
  status = 200
  force = true

# SPA catch-all: serve index.html for all other routes so TanStack Router
# can handle client-side navigation (dashboard, note, thread, space, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.com https://clerk.harvous.com https://*.posthog.com https://*.us.posthog.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.clerk.com https://clerk.harvous.com https://*.clerk.accounts.dev https://*.posthog.com https://*.us.posthog.com https://api.bible.org; frame-src 'self' https://*.clerk.com https://clerk.harvous.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # XSS Protection (legacy, but still useful)
    X-XSS-Protection = "1; mode=block"
    # Strict Transport Security (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Note: For scheduled functions, configure in Netlify dashboard:
# Site Settings > Functions > Scheduled Functions
# Or use an external cron service to call /api/inbox/auto-archive daily

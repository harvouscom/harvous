name: Harvous
# Do not add global CODE_SIGNING_ALLOWED: NO (breaks device install). XcodeGen is
# run automatically via npm install / npm run precommit; spec path: native/Harvous/project.yml
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "0.3.2"

targets:
  Harvous:
    type: application
    platform: [macOS, iOS]
    configFiles:
      Debug: Configuration/Harvous-Signing.xcconfig
      Release: Configuration/Harvous-Signing.xcconfig
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "*.xcodeproj"
          - "build/**"
          - "Tests/**"
          - "*.xctestplan"
          - "*.md"
          - "*.dmg"
          - "package-dmg.sh"
          - "release.sh"
          - "null.o"
          - ".harvous_ios_derived_data/**"
          - "reupload-mac-dmg.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harvous.app
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: targeted
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        DEVELOPMENT_TEAM: B3U6BXA8KP
        PROVISIONING_PROFILE_SPECIFIER: ""
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    entitlements:
      path: Harvous.entitlements

  HarvousTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HarvousTests
    dependencies:
      - target: Harvous_macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HarvousTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HarvousTests
    dependencies:
      - target: Harvous_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HarvousUITests_macOS:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/HarvousUITests
    dependencies:
      - target: Harvous_macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HarvousUITests_iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HarvousUITests
    dependencies:
      - target: Harvous_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Harvous_macOS:
    build:
      targets:
        Harvous_macOS: all
        HarvousTests_macOS: [test]
        HarvousUITests_macOS: [test]
    run:
      executable: Harvous_macOS
    test:
      gatherCoverageData: true
      targets:
        - name: HarvousTests_macOS
          parallelizable: true
          randomExecutionOrder: true
        - name: HarvousUITests_macOS
          parallelizable: false
          randomExecutionOrder: false
      testPlans:
        - path: Harvous_macOS.xctestplan
  Harvous_iOS:
    build:
      targets:
        Harvous_iOS: all
        HarvousTests_iOS: [test]
        HarvousUITests_iOS: [test]
    run:
      executable: Harvous_iOS
    test:
      gatherCoverageData: true
      targets:
        - name: HarvousTests_iOS
          parallelizable: true
          randomExecutionOrder: true
        - name: HarvousUITests_iOS
          parallelizable: false
          randomExecutionOrder: false
      testPlans:
        - path: Harvous_iOS.xctestplan
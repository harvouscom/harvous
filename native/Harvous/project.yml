name: Harvous
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_ENTITLEMENTS: ""

targets:
  Harvous:
    type: application
    platform: [macOS, iOS]
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "*.xcodeproj"
          - "build/**"
          - "Tests/**"
          - "*.xctestplan"
          - "*.md"
          - "*.dmg"
          - "package-dmg.sh"
          - "release.sh"
          - "null.o"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harvous.app
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: targeted
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    entitlements:
      path: Harvous.entitlements

  HarvousTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HarvousTests
    dependencies:
      - target: Harvous_macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HarvousTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HarvousTests
    dependencies:
      - target: Harvous_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HarvousUITests_macOS:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/HarvousUITests
    dependencies:
      - target: Harvous_macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HarvousUITests_iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HarvousUITests
    dependencies:
      - target: Harvous_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Harvous_macOS:
    build:
      targets:
        Harvous_macOS: all
        HarvousTests_macOS: [test]
        HarvousUITests_macOS: [test]
    run:
      executable: Harvous_macOS
    test:
      gatherCoverageData: true
      targets:
        - name: HarvousTests_macOS
          parallelizable: true
          randomExecutionOrder: true
        - name: HarvousUITests_macOS
          parallelizable: false
          randomExecutionOrder: false
      testPlans:
        - path: Harvous_macOS.xctestplan
  Harvous_iOS:
    build:
      targets:
        Harvous_iOS: all
        HarvousTests_iOS: [test]
        HarvousUITests_iOS: [test]
    run:
      executable: Harvous_iOS
    test:
      gatherCoverageData: true
      targets:
        - name: HarvousTests_iOS
          parallelizable: true
          randomExecutionOrder: true
        - name: HarvousUITests_iOS
          parallelizable: false
          randomExecutionOrder: false
      testPlans:
        - path: Harvous_iOS.xctestplan